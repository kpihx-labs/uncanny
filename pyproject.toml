[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[project]
name = "k-uncanny"
version = "0.1.1"
description = "CLI tool that detects AI-generated text with sentence-level scoring and multiple detection strategies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Frank Chan" }]
urls = { Homepage = "https://github.com/kpihx-labs/uncanny", Repository = "https://github.com/kpihx-labs/uncanny", Upstream = "https://github.com/dunkinfrunkin/uncanny", Issues = "https://github.com/kpihx-labs/uncanny/issues" }
keywords = ["ai-detection", "gpt", "llm", "text-analysis", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "transformers>=4.30",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
uncanny = "uncanny.cli:app"

[tool.uv.build-backend]
module-name = "uncanny"

[tool.pytest.ini_options]
testpaths = ["tests"]
