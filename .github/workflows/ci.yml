name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install Makefile shell on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python through UV
        run: uv python install

      - name: Run tests
        run: make check

      - name: Run benchmarks
        run: uv run uncanny bench --compare

  import-smoke:
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
      - name: Install Python through UV
        run: uv python install

      - name: Check imports
        run: uv run python -c "import uncanny; print(f'uncanny {uncanny.__version__}')"
